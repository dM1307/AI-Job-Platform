<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Job Platform — 2026 Console</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="bg-3d" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="flow flow-1"></div>
    <div class="flow flow-2"></div>
    <div class="grid-plane"></div>
</div>

<main class="app-shell">
    <header class="topbar glass">
        <h1>AI Job Platform</h1>
        <p>2026 Resume Intelligence Interface</p>
    </header>

    <section class="kpi-grid">
        <article class="glass kpi"><h3>Resumes</h3><p id="kpiResumes">0</p></article>
        <article class="glass kpi"><h3>Jobs</h3><p id="kpiJobs">0</p></article>
        <article class="glass kpi"><h3>Match Requests</h3><p id="kpiMatches">0</p></article>
    </section>

    <section class="panel-grid">
        <article class="glass panel">
            <h2>Add Resume</h2>
            <form id="resumeForm">
                <input type="text" id="candidateName" placeholder="Candidate Name" required />
                <input type="email" id="candidateEmail" placeholder="Email" required />
                <textarea id="candidateRawText" placeholder="Paste resume content" required></textarea>
                <button type="submit">Create Resume</button>
            </form>
        </article>

        <article class="glass panel">
            <h2>Add Job</h2>
            <form id="jobForm">
                <input type="text" id="jobTitle" placeholder="Job Title" required />
                <textarea id="jobDescription" placeholder="Job description" required></textarea>
                <button type="submit">Create Job</button>
            </form>
        </article>

        <article class="glass panel full">
            <div class="panel-header">
                <h2>Resumes & Match Jobs</h2>
                <button id="refreshBtn" type="button">Refresh</button>
            </div>
            <div id="resumeList" class="list"></div>
        </article>

        <article class="glass panel full">
            <h2>Activity Log</h2>
            <ul id="activityLog" class="log"></ul>
        </article>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
